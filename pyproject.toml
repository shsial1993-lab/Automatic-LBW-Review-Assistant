[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbw-review-assistant"
version = "0.1.0"
description = "Human-in-the-loop computer-vision assistant for cricket LBW review"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "streamlit>=1.36",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
